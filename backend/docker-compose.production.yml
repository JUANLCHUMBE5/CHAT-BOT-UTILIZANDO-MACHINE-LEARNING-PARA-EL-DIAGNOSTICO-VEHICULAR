services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carbot_db}
      POSTGRES_USER: ${POSTGRES_USER:-carbot_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - carbot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - carbot_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_ENABLED: "true"
      DATABASE_REQUIRED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-carbot_db}
      POSTGRES_USER: ${POSTGRES_USER:-carbot_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      QUEUE_EMBEDDED_WORKER: "false"
      ML_ROOT: /app/machine_learning
    volumes:
      - ${ML_HOST_PATH:?Set ML_HOST_PATH to the machine_learning directory}:/app/machine_learning:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "python -m alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_ENABLED: "true"
      DATABASE_REQUIRED: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-carbot_db}
      POSTGRES_USER: ${POSTGRES_USER:-carbot_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379/0
      QUEUE_EMBEDDED_WORKER: "false"
      ML_ROOT: /app/machine_learning
    volumes:
      - ${ML_HOST_PATH:?Set ML_HOST_PATH to the machine_learning directory}:/app/machine_learning:ro
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "src.application.jobs.worker"]

volumes:
  carbot_postgres:
  carbot_redis:
