name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: carbot_test
          POSTGRES_USER: carbot_app
          POSTGRES_PASSWORD: test_password_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carbot_app -d carbot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_ENABLED: "true"
      DATABASE_REQUIRED: "true"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: carbot_test
      POSTGRES_USER: carbot_app
      POSTGRES_PASSWORD: test_password_only
      TEST_DATABASE_URL: postgresql+asyncpg://carbot_app:test_password_only@127.0.0.1:5432/carbot_test
      DATABASE_POOL_SIZE: "0"
      PRIVACY_SECRET_KEY: ci_privacy_secret_only_not_for_production_123456
      JWT_SECRET_KEY: ci_jwt_secret_only_not_for_production_123456789
      LOCAL_AUTH_USERNAME: admin
      LOCAL_AUTH_PASSWORD: carbot2026
      META_APP_SECRET: ci_meta_secret
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: ruff check src tests main.py scripts ../machine_learning/training
      - run: ruff check src main.py --select S --ignore S104,S105,S110,S603
      - run: coverage run --source=src -m pytest -q -m "not real_gemini"
      - run: coverage report --fail-under=55
      - run: python -m alembic check
      - run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:harness
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
