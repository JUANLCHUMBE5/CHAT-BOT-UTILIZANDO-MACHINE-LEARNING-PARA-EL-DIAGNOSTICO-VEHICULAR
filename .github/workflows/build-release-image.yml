name: Build verified release image
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact full commit SHA with successful CI
        required: true
        type: string
      component:
        description: Component to publish (public frontend or backend)
        required: true
        default: backend
        type: choice
        options:
          - backend
          - frontend
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  build:
    if: inputs.component != 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: ghcr.io/juanlchumbe5/carbot-backend-monorepo
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Verify exact revision and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$REVISION&per_page=100" > /tmp/runs.json
          python - <<'PY'
          import json
          runs = [r for r in json.load(open('/tmp/runs.json'))['workflow_runs'] if r['name'] == 'CI']
          assert runs, 'Missing CI for requested revision'
          latest = max(runs, key=lambda r: r['id'])
          assert latest['status'] == 'completed' and latest['conclusion'] == 'success', 'CI not successful'
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ inputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify OCI, architecture and frozen SVM RAG without network
        run: |
          set -euo pipefail
          test "$(docker inspect "$IMAGE:$REVISION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          test "$(docker inspect "$IMAGE:$REVISION" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run --rm --network none -e CARBOT_BLOCK_DOTENV=true -e ENVIRONMENT=test -e DATABASE_ENABLED=false -e GEMINI_API_KEY= -e GROQ_API_KEY= -e META_ACCESS_TOKEN= -e ML_ROOT=/app/machine_learning -e PYTHONPATH=/app/backend "$IMAGE:$REVISION" python scripts/verify_release_image.py | tee image-smoke.log
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and verify digest availability
        run: |
          set -euo pipefail
          docker push "$IMAGE:$REVISION"
          DIGEST=$(docker inspect "$IMAGE:$REVISION" --format '{{index .RepoDigests 0}}')
          [[ "$DIGEST" =~ @sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$DIGEST" > image-manifest.txt
          printf '%s\n' "$DIGEST" > image-digest.txt
          printf 'Revision: `%s`\nImage: `%s`\n' "$REVISION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ inputs.revision }}
          path: |
            image-digest.txt
            image-manifest.txt
            image-smoke.log


  frontend:
    if: inputs.component == 'frontend'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: frontend-public-release-${{ inputs.revision }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/juanlchumbe5/carbot-frontend-monorepo
      REVISION: ${{ inputs.revision }}
      VITE_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Verify source revision and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"
          test -z "$(git status --porcelain)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$REVISION&per_page=100" > /tmp/runs.json
          python - <<'PY'
          import json
          runs = [r for r in json.load(open('/tmp/runs.json'))['workflow_runs'] if r['name'] == 'CI']
          assert runs, 'Missing source CI'
          latest = max(runs, key=lambda r: r['id'])
          assert latest['status'] == 'completed' and latest['conclusion'] == 'success', 'Source CI not successful'
          PY
          git ls-tree -r HEAD frontend > source-tree.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify public frontend and dependencies
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run verify | tee ../frontend-verify.log
          npm audit --audit-level=high | tee ../frontend-audit.log
          # Public build configuration, not a source edit or secret.
          printf 'VITE_API_BASE_URL=/api/v1\n' > .env.production
          test ! -e .dockerignore
          printf 'node_modules\ndist\ndist-laboratorio\n.git\n.env*\n!.env.production\n' > .dockerignore
          git diff --exit-code -- .
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ inputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.carbot.component=public-frontend
            io.carbot.api-base=/api/v1
            io.carbot.build-workflow-revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend-public
          cache-to: type=gha,mode=max,scope=frontend-public
      - name: Inspect final image and exclude laboratory
        run: |
          set -euo pipefail
          test "$(docker inspect "$IMAGE:$REVISION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          test "$(docker inspect "$IMAGE:$REVISION" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run --rm --network none "$IMAGE:$REVISION" nginx -t
          CID=$(docker create "$IMAGE:$REVISION")
          docker cp "$CID:/usr/share/nginx/html" /tmp/public-html
          docker rm "$CID"
          python - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('/tmp/public-html')
          files=[p for p in root.rglob('*') if p.is_file()]
          assert any(p.name=='index.html' for p in files)
          manifest={}
          scripts=[]
          for p in files:
              rel=str(p.relative_to(root))
              assert 'laboratorio' not in rel.lower() and not rel.startswith('lab/'), rel
              assert not p.name.startswith('.env'), rel
              if p.suffix in ('.js','.html'):
                  content=p.read_text()
                  for forbidden in ['laboratorio/mensaje','Laboratorio de Pruebas','lab_replay_','dist-laboratorio','laboratorio.html','http://localhost:8000']:
                      assert forbidden not in content, (rel,forbidden)
                  if p.suffix=='.js': scripts.append(content)
              manifest[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          assert '/api/v1' in ''.join(scripts), 'Missing public API base'
          pathlib.Path('public-files-sha256.json').write_text(json.dumps(manifest,indent=2))
          PY
          docker image inspect "$IMAGE:$REVISION" --format '{{json .Config.Labels}}' > image-labels.json
      - name: Verify HTTP proxy preserves API path (isolated fixture)
        run: |
          set -euo pipefail
          mkdir -p /tmp/proxy-fixture
          cat > /tmp/proxy-fixture/backend.py <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Type','application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'path':self.path}).encode())
          HTTPServer(('0.0.0.0',8000),Handler).serve_forever()
          PY
          cat > /tmp/proxy-fixture/edge.conf <<'NGINX'
          server {
              listen 80;
              location /api/ { proxy_pass http://api-fixture:8000; }
              location / { proxy_pass http://frontend-fixture:80; }
          }
          NGINX
          docker pull python:3.12-alpine
          docker pull nginx:alpine
          docker network create --internal public-release-test
          docker run -d --name api-fixture --network public-release-test -v /tmp/proxy-fixture/backend.py:/backend.py:ro python:3.12-alpine python /backend.py
          docker run -d --name frontend-fixture --network public-release-test "$IMAGE:$REVISION"
          docker run -d --name edge-fixture --network public-release-test -v /tmp/proxy-fixture/edge.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
          cat > /tmp/proxy-fixture/probe.py <<'PY'
          import json,time,urllib.request
          deadline=time.monotonic()+40
          while True:
              try:
                  with urllib.request.urlopen('http://edge-fixture/api/v1/probe?fixture=1',timeout=2) as r:
                      result=json.load(r)
                  break
              except Exception:
                  if time.monotonic()>=deadline: raise
                  time.sleep(.2)
          assert result['path']=='/api/v1/probe?fixture=1',result
          with urllib.request.urlopen('http://edge-fixture/',timeout=5) as r:
              assert r.status==200 and '<html' in r.read().decode().lower()
          print(json.dumps({'http':200,'backend_received_path':result['path'],'public_html':True,'environment':'isolated HTTP fixture, not VPS'}))
          PY
          docker run --rm --network public-release-test -v /tmp/proxy-fixture:/fixture:ro python:3.12-alpine python /fixture/probe.py | tee proxy-test.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish once and verify immutable digest
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$REVISION" >/tmp/existing.txt 2>/tmp/registry-error.txt; then
            echo 'Commit tag already exists; refusing to overwrite it.'
            exit 1
          elif ! grep -Eqi 'not found|manifest unknown|MANIFEST_UNKNOWN' /tmp/registry-error.txt; then
            cat /tmp/registry-error.txt
            exit 1
          fi
          docker push "$IMAGE:$REVISION"
          DIGEST=$(docker inspect "$IMAGE:$REVISION" --format '{{index .RepoDigests 0}}')
          [[ "$DIGEST" =~ @sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$DIGEST" > image-manifest.txt
          printf '%s\n' "$DIGEST" > image-digest.txt
          printf 'Source: `%s`\nWorkflow: `%s`\nAPI base: `/api/v1`\nImage: `%s`\n' "$REVISION" '${{ github.sha }}' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-public-frontend-${{ inputs.revision }}
          path: |
            image-digest.txt
            image-manifest.txt
            image-labels.json
            public-files-sha256.json
            proxy-test.json
            source-tree.txt
            frontend-verify.log
            frontend-audit.log
