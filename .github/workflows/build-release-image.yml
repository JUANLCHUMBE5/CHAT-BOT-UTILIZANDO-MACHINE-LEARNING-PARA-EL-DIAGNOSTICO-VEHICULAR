name: Build verified release image
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Exact full commit SHA with successful CI
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      IMAGE: ghcr.io/juanlchumbe5/carbot-backend
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Verify exact revision and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVISION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$REVISION&per_page=100" > /tmp/runs.json
          python - <<'PY'
          import json
          runs = [r for r in json.load(open('/tmp/runs.json'))['workflow_runs'] if r['name'] == 'CI']
          assert runs, 'Missing CI for requested revision'
          latest = max(runs, key=lambda r: r['id'])
          assert latest['status'] == 'completed' and latest['conclusion'] == 'success', 'CI not successful'
          PY
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ inputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify OCI, architecture and frozen SVM RAG without network
        run: |
          set -euo pipefail
          test "$(docker inspect "$IMAGE:$REVISION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          test "$(docker inspect "$IMAGE:$REVISION" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          docker run --rm --network none -e CARBOT_BLOCK_DOTENV=true -e ENVIRONMENT=test -e DATABASE_ENABLED=false -e GEMINI_API_KEY= -e GROQ_API_KEY= -e META_ACCESS_TOKEN= -e ML_ROOT=/app/machine_learning -e PYTHONPATH=/app/backend "$IMAGE:$REVISION" python scripts/verify_release_image.py | tee image-smoke.log
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and verify digest availability
        run: |
          set -euo pipefail
          docker push "$IMAGE:$REVISION"
          DIGEST=$(docker inspect "$IMAGE:$REVISION" --format '{{index .RepoDigests 0}}')
          [[ "$DIGEST" =~ @sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$DIGEST" > image-manifest.txt
          printf '%s\n' "$DIGEST" > image-digest.txt
          printf 'Revision: `%s`\nImage: `%s`\n' "$REVISION" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-${{ inputs.revision }}
          path: |
            image-digest.txt
            image-manifest.txt
            image-smoke.log
