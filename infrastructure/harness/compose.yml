services:
  postgres:
    extends: {file: ../../backend/docker-compose.e2e.yml, service: postgres}
  redis:
    extends: {file: ../../backend/docker-compose.e2e.yml, service: redis}
  api:
    extends: {file: ../../backend/docker-compose.e2e.yml, service: api}
    image: ${CARBOT_HARNESS_RUNTIME_IMAGE:-carbot-harness:local}
    build: !reset null
    volumes: &source
      - ${CARBOT_HARNESS_SOURCE:?Set frozen source}/backend:/app/backend:ro
      - ../../machine_learning:/app/machine_learning:ro
      - ${CARBOT_HARNESS_RAG:?Set verified staged RAG}:/app/machine_learning/manuals/candidates/v1:ro
      - ${CARBOT_HARNESS_ARTIFACTS:?Set isolated artifact directory}:/artifacts
    environment:
      TRACKER_CSV_PATH: /tmp/tracker.csv
  worker:
    extends: {file: ../../backend/docker-compose.e2e.yml, service: worker}
    image: ${CARBOT_HARNESS_RUNTIME_IMAGE:-carbot-harness:local}
    build: !reset null
    volumes: *source
    environment:
      TRACKER_CSV_PATH: /tmp/tracker.csv
  runner:
    user: '0:0'
    extends: {file: ../../backend/docker-compose.e2e.yml, service: runner}
    image: ${CARBOT_HARNESS_RUNTIME_IMAGE:-carbot-harness:local}
    build: !reset null
    volumes: *source
  tests:
    user: '0:0'
    extends: {file: ../../backend/docker-compose.e2e.yml, service: runner}
    image: ${CARBOT_HARNESS_TEST_IMAGE:-carbot-harness-tests:local}
    build: !reset null
    volumes: *source
    environment:
      DATABASE_URL: postgresql+asyncpg://carbot_e2e:e2e_password_only_not_production@postgres:5432/carbot_lab_test
      TEST_DATABASE_URL: postgresql+asyncpg://carbot_e2e:e2e_password_only_not_production@postgres:5432/carbot_lab_test
      REDIS_URL: redis://redis:6379/13
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/13
      COVERAGE_CORE: sysmon
      COVERAGE_FILE: /artifacts/.coverage
      TRACKER_CSV_PATH: /tmp/tracker.csv
    entrypoint: [sh, -c]
    command: ['python -m alembic upgrade head && coverage run --source=src -m pytest -q -p no:cacheprovider -m "not real_gemini" --junitxml=/artifacts/pytest.xml > /artifacts/pytest.log 2>&1; TEST_STATUS=$$?; coverage report --fail-under=55 > /artifacts/coverage.txt; COVERAGE_STATUS=$$?; if [ "$$TEST_STATUS" -ne 0 ]; then exit "$$TEST_STATUS"; fi; exit "$$COVERAGE_STATUS"']
  lab:
    user: '0:0'
    extends: {file: ../../backend/docker-compose.e2e.yml, service: api}
    image: ${CARBOT_HARNESS_RUNTIME_IMAGE:-carbot-harness:local}
    build: !reset null
    volumes:
      - ${CARBOT_HARNESS_SOURCE:?Set frozen source}/backend:/app/backend:ro
      - ../../machine_learning:/app/machine_learning:ro
      - ${CARBOT_HARNESS_RAG:?Set verified staged RAG}:/app/machine_learning/manuals/candidates/v1:ro
      - ${CARBOT_HARNESS_SOURCE:?Set frozen source}/frontend/lab:/lab-web:ro
      - ${CARBOT_HARNESS_ARTIFACTS:?Set isolated artifact directory}:/artifacts
    environment:
      CARBOT_LAB_ENABLED: 'true'
      CARBOT_LAB_PORT: ${CARBOT_LAB_PORT:-8765}
      TRACKER_CSV_PATH: /tmp/tracker.csv
    depends_on:
      api: {condition: service_healthy}
      worker: {condition: service_started}
    command: [uvicorn, scripts.lab.app:app, --host, 0.0.0.0, --port, '8765']
    healthcheck:
      test: [CMD, curl, -fsS, 'http://localhost:8765/lab/scenarios']
      interval: 5s
      timeout: 3s
      retries: 30
  web:
    image: nginx:alpine
    ports: ['127.0.0.1:${CARBOT_LAB_PORT:-8765}:80']
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, access]
    depends_on:
      lab: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/lab/scenarios']
      interval: 5s
      timeout: 3s
      retries: 30
networks:
  default:
    internal: true
    ipam:
      config:
        - subnet: ${CARBOT_HARNESS_SUBNET:?Select an unused isolated subnet}







  access:
    ipam:
      config:
        - subnet: ${CARBOT_HARNESS_ACCESS_SUBNET:-10.253.250.0/24}


