[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-diagnostico-vehicular"
version = "1.0.0"
description = "Chatbot utilizando machine learning para el diagnóstico vehicular en talleres mecánicos de Carabayllo"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Juan Joel Leon Chumbe" },
    { name = "Luisa Leonor Poma Cataño" }
]
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "pydantic==2.13.4",
    "pandas==3.0.3",
    "numpy==2.5.0",
    "scikit-learn==1.9.0",
    "joblib==1.5.3",
    "scipy==1.18.0",
    "requests==2.34.2",
    "faiss-cpu==1.15.0",
    "PyJWT==2.13.0",
    "cryptography==50.0.0",
    "slowapi==0.1.10",
    "limits[redis]==5.8.0",
    "redis==7.2.1",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "SQLAlchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "coverage==7.13.5",
    "ruff==0.15.5",
    "pip-audit==2.10.0"
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# La base historica se moderniza de forma incremental. CI bloquea desde ahora
# errores de sintaxis, nombres inexistentes, imports inutiles y variables muertas.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 55
show_missing = true
